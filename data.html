<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Data</title>

  <link rel="stylesheet" href="style.css">

  <!-- Semantic UI -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui/dist/semantic.min.css">

  <!-- Handlebars -->
  <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>
</head>

<body>

<nav class="ui inverted menu">
  <a class="item" href="index.html">Home</a>
  <a class="item" href="data.html">Movies</a>
  <a class="item" href="about.html">About</a>
</nav>

<div class="container">

  <h1>Movie Collection</h1>

  <input type="text" id="searchInput" placeholder="Search movie">

  <button class="ui green button" onclick="searchMovie()">
    Search
  </button>

  <form id="movieForm">

    <input type="text" id="title" placeholder="Movie Title" required>

    <input type="text" id="genre" placeholder="Genre" required>

    <button class="ui blue button" type="submit">
      Add Movie
    </button>

  </form>

  <div id="movieContainer"></div>

</div>

<!-- Handlebars -->
<script id="movieTemplate" type="text/x-handlebars-template">

  {{#each movies}}

  <div class="ui card movie-card">

    <div class="content">
      <div class="header">{{title}}</div>

      <div class="description">
        Genre: {{genre}}
      </div>

      <div class="meta">
        {{date}}
      </div>
    </div>

    <div class="extra content">
      <button class="ui red button"
        onclick="deleteMovie({{id}})">
        Delete
      </button>
    </div>

  </div>

  {{/each}}

</script>

<script src="data.js"></script>

</body>
</html>
